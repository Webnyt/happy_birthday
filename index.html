<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise with Audio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Birthday Surprise</h1>
        <div class="stage">
            <div id="arc" class="heart">❤️</div>
            <div class="archery-container">
                <svg id="archery-svg" viewBox="0 0 100 100" width="100" height="100">
                    <g id="bow-body">
                        <path d="M 20 80 Q 50 50 20 20" fill="none" stroke="#e0a96d" stroke-width="4" stroke-linecap="round"/>
                        <line x1="20" y1="20" x2="20" y2="80" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
                    </g>
                    <g id="arrow">
                        <line x1="15" y1="55" x2="55" y2="15" stroke="#ff4757" stroke-width="4" stroke-linecap="round"/>
                        <polygon points="55,15 42,18 52,28" fill="#ff4757"/>
                        <line x1="15" y1="55" x2="20" y2="60" stroke="#ffffff" stroke-width="2"/>
                        <line x1="19" y1="51" x2="24" y2="56" stroke="#ffffff" stroke-width="2"/>
                    </g>
                </svg>
            </div>
            <div id="cake" class="cake">
                <div class="cake-top-layer"></div>
                <div class="cake-middle-layer"></div>
                <div class="cake-base"></div>
            </div>
            <div class="floating-decorations">
                <span class="balloon b1"></span>
                <span class="balloon b2"></span>
            </div>
            <div class="birthday-text">
                <h2>Happy Birthday</h2>
            </div>
            <button id="play-audio-btn" class="audio-btn">Tap to Start 🎵</button>
        </div>
        <audio id="bg-music" controls preload="auto" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
