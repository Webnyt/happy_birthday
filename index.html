<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Mercy ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-bubbles">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- FIRST SCREEN -->
  <div id="start-screen">
    <div class="gift-box" id="gift-box">
      <div class="lid"></div>
      <div class="box"></div>
      <div class="ribbon"></div>
      <div class="bow">🎀</div>
    </div>
    <h1>Special delivery for</h1>
    <h2 class="name">Mercy</h2>
    <p>Tap the gift box</p>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="hidden">
    <div class="floating-balloons">
      <div class="balloon b1">M</div>
      <div class="balloon b2">E</div>
      <div class="balloon b3">R</div>
      <div class="balloon b4">C</div>
      <div class="balloon b5">Y</div>
    </div>

    <div class="cake-wrap">
      <div class="candle" id="candle"><div class="flame"></div></div>
      <div class="cake">
        <div class="cake-top"></div>
        <div class="cake-middle"></div>
        <div class="cake-base"></div>
        <div class="icing-drip"></div>
      </div>
    </div>

    <div class="message-card">
      <h2>Happy Birthday, <span>Mercy!</span></h2>
      <p id="typewriter"></p>
      <div class="btns">
        <button id="play-audio-btn" class="btn primary">🎵 Tap to Play Song</button>
        <button id="confetti-btn" class="btn secondary">Celebrate Again 🎉</button>
      </div>
      <p class="hint">hint: tap the flame to blow the candle</p>
    </div>

    <audio id="bg-music" preload="auto" loop>
      <source src="song.mp3" type="audio/mpeg">
    </audio>
  </div>

  <canvas id="confetti"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
